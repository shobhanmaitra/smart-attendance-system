<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendanc Management System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>Smart Attendance Management System</h1>
    <p>DevOps-Based Automated Deployment Demo</p>
  </header>

  <main class="container">

    <section class="date-bar">
      <label for="attendanceDate">Select Date:</label>
      <input type="date" id="attendanceDate">
    </section>

    <section class="cards">
      <div class="card">
        <h3>Total Students</h3>
        <p id="totalStudents">0</p>
      </div>
      <div class="card present">
        <h3>Present</h3>
        <p id="presentCount">0</p>
      </div>
      <div class="card absent">
        <h3>Absent</h3>
        <p id="absentCount">0</p>
      </div>
      <div class="card percent">
        <h3>Attendance %</h3>
        <p id="attendancePercent">0%</p>
      </div>
    </section>

    <section class="panel">
      <h2>Mark Attendance</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Attendance Records</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Present</th>
              <th>Absent</th>
              <th>Attendance %</th>
            </tr>
          </thead>
          <tbody id="recordsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>B.Tech CSE Project | Docker + Jenkins CI/CD</footer>

  <script src="script.js"></script>
</body>

</html>
